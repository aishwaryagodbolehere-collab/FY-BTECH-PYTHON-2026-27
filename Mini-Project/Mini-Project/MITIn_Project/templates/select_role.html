<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITIn — Select Your Role</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1e3a8a">

  <!-- Block Back-Button Access After Logout / Account Deletion -->
  <script>
    (function () {
      function checkSignedIn() {
        const email = (localStorage.getItem('mitin_user_email') || localStorage.getItem('google_email') || '').trim();
        if (!email) {
          window.location.replace('/login/');
        }
      }
      checkSignedIn();
      window.addEventListener('pageshow', (event) => {
        checkSignedIn();
        if (event.persisted) window.location.reload();
      });
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/theme.js"></script>
</head>

<body class="min-h-screen bg-gray-50 font-sans text-gray-800 selection:bg-blue-200 selection:text-blue-900">

  <!-- Header -->
  <header class="absolute inset-x-0 top-0 z-10 mx-auto flex max-w-6xl items-center justify-between gap-4 px-6 py-6">
    <a href="/" class="text-2xl font-black tracking-tight text-blue-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600">
      MITIn<span class="text-blue-600">.</span>
    </a>
    <button type="button" id="logout-switch-btn" class="text-xs font-bold text-gray-500 hover:text-blue-900 transition">
      Logout / Switch Account
    </button>
  </header>

  <main class="flex min-h-screen flex-col items-center justify-center px-6 py-24">
    <!-- Page Header -->
    <div class="mb-12 text-center">
      <h1 class="text-3xl font-extrabold tracking-tight text-blue-900 sm:text-4xl">
        Choose your journey
      </h1>
      <p id="welcome-user-line" class="mt-4 text-base text-gray-500">
        Select your role to personalize your MITIn experience.
      </p>
    </div>

    <!-- Role Selection Cards Grid -->
    <div class="mx-auto w-full max-w-5xl">
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

        <!-- Student Card -->
        <button type="button" id="student-role-card" class="group relative flex flex-col rounded-2xl border border-gray-200 bg-white p-8 text-left shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-blue-300 hover:shadow-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
          <div class="mb-6 flex w-full items-center justify-between">
            <div class="inline-flex h-14 w-14 items-center justify-center rounded-xl bg-blue-50 text-blue-600 transition-colors group-hover:bg-blue-600 group-hover:text-white">
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" />
              </svg>
            </div>
            <span id="student-status-badge" class="hidden rounded-full bg-green-50 border border-green-200 px-2.5 py-0.5 text-[11px] font-bold text-green-700">
              PIN Protected
            </span>
          </div>
          <h2 class="text-xl font-bold text-gray-900">Student</h2>
          <p class="mt-3 text-sm leading-6 text-gray-500">
            Build your academic profile, showcase your skills, and discover campus opportunities.
          </p>
          <div class="mt-6 flex items-center text-sm font-semibold text-blue-600 md:opacity-0 transition-opacity md:group-hover:opacity-100">
            Continue as Student <span aria-hidden="true" class="ml-2">→</span>
          </div>
        </button>

        <!-- Recruiter Card -->
        <button type="button" id="recruiter-role-card" class="group relative flex flex-col rounded-2xl border border-gray-200 bg-white p-8 text-left shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-gray-400 hover:shadow-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-500">
          <div class="mb-6 flex w-full items-center justify-between">
            <div class="inline-flex h-14 w-14 items-center justify-center rounded-xl bg-gray-100 text-gray-600 transition-colors group-hover:bg-gray-800 group-hover:text-white">
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0112 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 01-.673-.38m0 0A2.18 2.18 0 013 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 013.413-.387m7.5 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0M12 12.75h.008v.008H12v-.008z" />
              </svg>
            </div>
            <span id="recruiter-status-badge" class="hidden rounded-full bg-green-50 border border-green-200 px-2.5 py-0.5 text-[11px] font-bold text-green-700">
              PIN Protected
            </span>
          </div>
          <h2 class="text-xl font-bold text-gray-900">Recruiter</h2>
          <p class="mt-3 text-sm leading-6 text-gray-500">
            Find and connect with top MIT-WPU engineering talent for your team.
          </p>
          <div class="mt-6 flex items-center text-sm font-semibold text-gray-600 md:opacity-0 transition-opacity md:group-hover:opacity-100">
            Continue as Recruiter <span aria-hidden="true" class="ml-2">→</span>
          </div>
        </button>

        <!-- Admin Card -->
        <a href="/admin/" class="group relative flex flex-col rounded-2xl border border-gray-200 bg-white p-8 text-left shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-gray-400 hover:shadow-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-500">
          <div class="mb-6 inline-flex h-14 w-14 items-center justify-center rounded-xl bg-gray-100 text-gray-600 transition-colors group-hover:bg-gray-800 group-hover:text-white">
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
          </div>
          <h2 class="text-xl font-bold text-gray-900">Admin</h2>
          <p class="mt-3 text-sm leading-6 text-gray-500">
            Manage platform settings, verify users, and oversee the university network.
          </p>
          <div class="mt-6 flex items-center text-sm font-semibold text-gray-600 md:opacity-0 transition-opacity md:group-hover:opacity-100">
            Continue as Admin <span aria-hidden="true" class="ml-2">→</span>
          </div>
        </a>

      </div>
    </div>
  </main>

<!-- 4-DIGIT SECURITY PIN MODAL (Supports Both Student & Recruiter Roles + Optional Fingerprint) -->
  <div id="pin-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-blue-950/60 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-2xl border border-gray-200 text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-blue-100 text-blue-900 font-bold text-lg">
        🔒
      </div>
      <h3 id="pin-modal-title" class="text-xl font-black text-blue-900">Security PIN Required</h3>
      <p id="pin-modal-subtitle" class="mt-2 text-xs text-gray-500">
        Enter your 4-digit security PIN to unlock your dashboard directly.
      </p>

      <form id="verify-pin-form" class="mt-6 space-y-4">
        <input
          type="password"
          id="security-pin-input"
          maxlength="4"
          pattern="\d{4}"
          inputmode="numeric"
          required
          placeholder="• • • •"
          class="w-full rounded-xl border border-gray-300 px-4 py-3 text-center text-2xl font-black tracking-[0.5em] text-blue-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
        >
        <p id="pin-error-msg" class="hidden text-xs font-semibold text-red-600"></p>

        <!-- Optional Opt-In Checkbox (Only shown on supported phones before enabling) -->
        <label id="biometric-optin-row" class="hidden flex items-center justify-center gap-2 text-xs font-medium text-gray-500 cursor-pointer select-none">
          <input id="enable-biometric-checkbox" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-900 focus:ring-blue-600">
          <span>Enable Fingerprint Unlock (optional)</span>
        </label>

        <button type="submit" id="verify-pin-btn" class="w-full rounded-xl bg-blue-900 py-3 text-sm font-bold text-white shadow-lg hover:bg-blue-800 transition">
          Unlock Portal →
        </button>
      </form>

      <!-- Quick Fingerprint Unlock Section (Only shown after user enables it on this phone) -->
      <div id="biometric-unlock-section" class="hidden mt-4 pt-4 border-t border-gray-100">
        <button
          type="button"
          id="biometric-unlock-btn"
          class="w-full rounded-xl border border-blue-200 bg-blue-50 py-2.5 px-4 text-sm font-bold text-blue-900 hover:bg-blue-100 transition flex items-center justify-center gap-2"
        >
          <span>👆</span>
          <span>Unlock with Fingerprint</span>
        </button>
        <button
          type="button"
          id="disable-biometric-btn"
          class="mt-2 text-[11px] font-semibold text-gray-400 hover:text-red-500 transition"
        >
          Disable Fingerprint on this device
        </button>
      </div>

      <button type="button" id="close-pin-modal" class="mt-4 text-xs font-semibold text-gray-400 hover:text-gray-600">
        Cancel
      </button>
    </div>
  </div>

  <script>
    let studentName = localStorage.getItem('mitin_student_name') || localStorage.getItem('google_name') || '';
    let userEmail = (localStorage.getItem('mitin_user_email') || localStorage.getItem('google_email') || '').trim().toLowerCase();
    let isStudentOnboarded = localStorage.getItem('mitin_is_onboarded') === 'true';
    let currentPrn = localStorage.getItem('mitin_current_prn') || localStorage.getItem('mitin_student_prn') || '';

    let isRecruiterOnboarded = localStorage.getItem('mitin_is_recruiter_onboarded') === 'true';
    let recruiterEmail = (localStorage.getItem('mitin_recruiter_email') || userEmail).trim().toLowerCase();

    // Redirect unauthenticated visitors cleanly to /login/
    if (!userEmail) {
      window.location.href = '/login/';
    }

    function updateRoleBadges() {
      if (studentName || userEmail) {
        document.getElementById('welcome-user-line').textContent =
          `Signed in as ${studentName || 'MITIn User'} (${userEmail}). Choose your portal below.`;
      }

      const stuBadge = document.getElementById('student-status-badge');
      if (isStudentOnboarded && currentPrn && !String(currentPrn).startsWith('PENDING_')) {
        stuBadge.classList.remove('hidden');
      } else {
        stuBadge.classList.add('hidden');
      }

      const recBadge = document.getElementById('recruiter-status-badge');
      if (isRecruiterOnboarded && recruiterEmail) {
        recBadge.classList.remove('hidden');
      } else {
        recBadge.classList.add('hidden');
      }
    }

    updateRoleBadges();

    // Always sync live role status strictly for the signed-in email and wipe any stale PRN/recruiter keys
    async function syncRolesFromBackend() {
      if (!userEmail) return;
      try {
        const res = await fetch('/api/auth/verify/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: userEmail,
            full_name: studentName || 'User',
            firebase_uid: localStorage.getItem('google_uid') || ''
          })
        });
        if (!res.ok) return;
        const data = await res.json();

        if (data.full_name) {
          studentName = data.full_name;
          localStorage.setItem('mitin_student_name', studentName);
          localStorage.setItem('google_name', studentName);
        }

        // Student state (clear stale PRN if this email is NOT onboarded)
        isStudentOnboarded = Boolean(data.is_onboarded && data.prn && !String(data.prn).startsWith('PENDING_'));
        localStorage.setItem('mitin_is_onboarded', isStudentOnboarded ? 'true' : 'false');
        if (isStudentOnboarded) {
          currentPrn = data.prn;
          localStorage.setItem('mitin_current_prn', data.prn);
          localStorage.setItem('mitin_student_prn', data.prn);
        } else {
          currentPrn = '';
          localStorage.removeItem('mitin_current_prn');
          localStorage.removeItem('mitin_student_prn');
        }

        // Recruiter state (clear stale recruiter keys if this email is NOT onboarded as recruiter)
        isRecruiterOnboarded = Boolean(data.is_recruiter_onboarded);
        localStorage.setItem('mitin_is_recruiter_onboarded', isRecruiterOnboarded ? 'true' : 'false');
        if (isRecruiterOnboarded) {
          recruiterEmail = (data.recruiter_email || userEmail).trim().toLowerCase();
          localStorage.setItem('mitin_recruiter_email', recruiterEmail);
          if (data.company_name) {
            localStorage.setItem('mitin_recruiter_company', data.company_name);
          }
        } else {
          recruiterEmail = '';
          localStorage.removeItem('mitin_recruiter_email');
          localStorage.removeItem('mitin_recruiter_user');
          localStorage.removeItem('mitin_recruiter_company');
        }

        updateRoleBadges();
      } catch (e) {
        console.error("Role sync error:", e);
      }
    }

    const roleSyncPromise = syncRolesFromBackend();

    // Logout / Switch Account clears session completely and goes to /login/
    document.getElementById('logout-switch-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/login/';
    });

  const pinModal = document.getElementById('pin-modal');
    const pinInput = document.getElementById('security-pin-input');
    const pinError = document.getElementById('pin-error-msg');
    const pinTitle = document.getElementById('pin-modal-title');
    const pinSubtitle = document.getElementById('pin-modal-subtitle');
    const pinBtn = document.getElementById('verify-pin-btn');
    const bioOptInRow = document.getElementById('biometric-optin-row');
    const bioCheckbox = document.getElementById('enable-biometric-checkbox');
    const bioUnlockSection = document.getElementById('biometric-unlock-section');
    const bioUnlockBtn = document.getElementById('biometric-unlock-btn');
    const bioDisableBtn = document.getElementById('disable-biometric-btn');
    let activePinRole = 'student';

    function getActivePinEmail() {
      return (activePinRole === 'recruiter' ? (recruiterEmail || userEmail) : userEmail).trim().toLowerCase();
    }

    function isBiometricSupported() {
      return Boolean(
        window.AndroidBridge &&
        typeof window.AndroidBridge.isBiometricAvailable === 'function' &&
        window.AndroidBridge.isBiometricAvailable()
      );
    }

    function refreshBiometricUI() {
      const bioEmail = getActivePinEmail();
      if (bioCheckbox) bioCheckbox.checked = false;

      let reason = '';
      if (!window.AndroidBridge) {
        reason = 'Debug: AndroidBridge not found (open the Android Studio APK, not Chrome/PWA)';
      } else if (typeof window.AndroidBridge.isBiometricAvailable !== 'function') {
        reason = 'Debug: Old APK installed (isBiometricAvailable missing — rebuild & reinstall APK)';
      } else if (!window.AndroidBridge.isBiometricAvailable()) {
        reason = 'Debug: Phone reports biometrics unavailable or no fingerprint enrolled';
      }

      if (reason || !bioEmail) {
        bioOptInRow.classList.add('hidden');
        bioUnlockSection.classList.add('hidden');
        if (reason) {
          pinError.textContent = reason;
          pinError.classList.remove('hidden');
        }
        return;
      }

      const enabled = window.AndroidBridge.hasBiometricPin(bioEmail, activePinRole);
      bioUnlockSection.classList.toggle('hidden', !enabled);
      bioOptInRow.classList.toggle('hidden', enabled);
    }

    function openPinModal(role) {
      activePinRole = role;
      const targetEmail = getActivePinEmail();
      pinTitle.textContent = role === 'recruiter' ? 'Recruiter Security PIN' : 'Student Security PIN';
      pinSubtitle.textContent = role === 'recruiter'
        ? `Enter the 4-digit PIN for ${targetEmail} to open the Recruiter Dashboard.`
        : `Enter the 4-digit PIN for ${targetEmail} to open your Student Profile.`;
      pinError.classList.add('hidden');
      pinBtn.textContent = 'Unlock Portal →';
      pinInput.value = '';
      refreshBiometricUI();
      pinModal.classList.remove('hidden');
      pinModal.classList.add('flex');
      pinInput.focus();
    }

    // 1. Click handler for Student Card (awaits DB sync so stale data can't race)
    document.getElementById('student-role-card').addEventListener('click', async () => {
      await roleSyncPromise;
      if (isStudentOnboarded && currentPrn && !String(currentPrn).startsWith('PENDING_')) {
        openPinModal('student');
      } else {
        window.location.href = '/onboarding/';
      }
    });

    // 2. Click handler for Recruiter Card (awaits DB sync)
    document.getElementById('recruiter-role-card').addEventListener('click', async () => {
      await roleSyncPromise;
      if (isRecruiterOnboarded && (recruiterEmail || userEmail)) {
        openPinModal('recruiter');
      } else {
        window.location.href = '/recruiter-onboarding/';
      }
    });

    document.getElementById('close-pin-modal').addEventListener('click', () => {
      pinModal.classList.add('hidden');
      pinModal.classList.remove('flex');
    });

    // Trigger Android Fingerprint Prompt
    bioUnlockBtn.addEventListener('click', () => {
      pinError.classList.add('hidden');
      const bioEmail = getActivePinEmail();
      if (window.AndroidBridge && typeof window.AndroidBridge.authenticateWithBiometric === 'function') {
        window.AndroidBridge.authenticateWithBiometric(bioEmail, activePinRole);
      }
    });

    // Optional: Turn off Fingerprint Unlock right from the modal
    bioDisableBtn.addEventListener('click', () => {
      const bioEmail = getActivePinEmail();
      if (window.AndroidBridge && typeof window.AndroidBridge.disableBiometricPin === 'function') {
        window.AndroidBridge.disableBiometricPin(bioEmail, activePinRole);
      }
      refreshBiometricUI();
    });

    // Shared PIN Verification (used by both manual typing and Fingerprint Unlock)
    async function submitPinVerification(pin, fromBiometric = false) {
      pinBtn.textContent = fromBiometric ? 'Fingerprint Verified...' : 'Verifying...';
      pinError.classList.add('hidden');

      const bioEmail = getActivePinEmail();
      const endpoint = activePinRole === 'recruiter' ? '/api/recruiter/verify-pin/' : '/api/student/verify-pin/';
      const payload = activePinRole === 'recruiter'
        ? { email: bioEmail, pin: pin }
        : { email: userEmail, prn: userEmail ? '' : currentPrn, pin: pin };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          // If the user opted in during manual PIN entry, trigger fingerprint registration
          if (!fromBiometric && bioCheckbox && bioCheckbox.checked &&
              window.AndroidBridge && typeof window.AndroidBridge.enableBiometricPin === 'function') {
            window.AndroidBridge.enableBiometricPin(bioEmail, activePinRole, pin);
          }

          if (activePinRole === 'recruiter') {
            localStorage.setItem('mitin_recruiter_user', data.work_email);
            localStorage.setItem('mitin_recruiter_email', data.work_email);
            localStorage.setItem('mitin_recruiter_name', data.full_name);
            localStorage.setItem('mitin_recruiter_company', data.company_name);
            window.location.href = '/recruiter/';
          } else {
            localStorage.setItem('mitin_current_prn', data.prn);
            localStorage.setItem('mitin_student_prn', data.prn);
            localStorage.setItem('mitin_student_name', data.full_name);
            if (data.email) {
              localStorage.setItem('mitin_user_email', data.email.toLowerCase());
              localStorage.setItem('google_email', data.email.toLowerCase());
            }
            window.location.href = '/profile/';
          }
        } else {
          // If saved biometric PIN no longer matches (e.g., user reset PIN via OTP), clear it cleanly
          if (fromBiometric && res.status === 401 &&
              window.AndroidBridge && typeof window.AndroidBridge.disableBiometricPin === 'function') {
            window.AndroidBridge.disableBiometricPin(bioEmail, activePinRole);
            refreshBiometricUI();
            pinError.textContent = 'Your PIN changed. Enter your new 4-digit PIN once to re-enable Fingerprint.';
          } else {
            pinError.textContent = data.error || 'Incorrect 4-digit PIN.';
          }
          pinError.classList.remove('hidden');
          pinBtn.textContent = 'Unlock Portal →';
        }
      } catch (err) {
        console.error('PIN check error:', err);
        pinError.textContent = 'Server error while verifying PIN.';
        pinError.classList.remove('hidden');
        pinBtn.textContent = 'Unlock Portal →';
      }
    }

    // 3. Manual PIN form submit
    document.getElementById('verify-pin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await submitPinVerification(pinInput.value.trim(), false);
    });

    // 4. Callbacks triggered by MainActivity.kt after Fingerprint scan
    window.onBiometricPinUnlocked = function (savedPin) {
      pinInput.value = savedPin;
      submitPinVerification(savedPin, true);
    };

    window.onBiometricError = function (msg) {
      pinError.textContent = msg || 'Fingerprint check failed. Please enter your PIN.';
      pinError.classList.remove('hidden');
    };
  </script>
</body>
</html>
